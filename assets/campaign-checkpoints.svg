<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 490" width="1440" height="490" role="img" aria-labelledby="title desc">
  <title id="title">캠페인 체크포인트 — 다음 세션으로 이어지는 E2E</title>
  <desc id="desc">세션 A가 완료한 셀과 진행 중인 셀의 상태를 디스크에 기록한다. 새 세션은 체크포인트와 실제 worker 소유권을 확인하고 기존 작업을 관측하거나 실패 근거를 바탕으로 재개한다. 완료 셀의 측정 증거는 보존한다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#274461"/></marker></defs>
  <rect width="1440" height="490" rx="20" fill="#f2f1e8"/>
  <g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, sans-serif" fill="#243344">
    <text x="48" y="53" font-size="26" font-weight="700">호출은 끝나도, E2E의 근거와 재개점은 남습니다.</text>
    <text x="48" y="86" font-size="19">캠페인 = 전체 목표와 셀 목록 / 셀 = 모델 × 승인 전략 × 비교 조건 / attempt = 같은 조건 안의 시도</text>
    <rect x="48" y="120" width="366" height="255" rx="15" fill="#fffefa" stroke="#b9c4c9" stroke-width="1.5"/>
    <text x="73" y="158" font-size="24" font-weight="700">첫 세션 · 호출 A</text>
    <rect x="73" y="184" width="316" height="55" rx="9" fill="#e4eee7"/>
    <text x="91" y="219" font-size="20" fill="#315d43">셀 A / 기능검사 + 측정 PASS</text>
    <rect x="73" y="251" width="316" height="55" rx="9" fill="#f5e8d6"/>
    <text x="91" y="286" font-size="20" fill="#805324">셀 B / attempt 1 · 진행 중</text>
    <text x="73" y="343" font-size="19" fill="#657077">compact · 호출 종료 · 세션 중단</text>
    <rect x="503" y="120" width="434" height="255" rx="15" fill="#e5eceb" stroke="#63887e" stroke-width="2"/>
    <text x="530" y="158" font-size="24" font-weight="700">디스크의 체크포인트와 증거</text>
    <text x="530" y="199" font-size="19">고정 선언 · 승인 · 완료 셀 · 미결 질문</text>
    <text x="530" y="234" font-size="19">현재 셀 / attempt · 로그 · 측정 결과</text>
    <text x="530" y="269" font-size="19">worker / 컨테이너 소유권 · 다음 작업</text>
    <text x="530" y="309" font-size="18" fill="#465c58">output/campaigns/&lt;id&gt;/</text>
    <text x="530" y="342" font-size="18" fill="#465c58">output/&lt;model&gt;/attempts/&lt;attempt&gt;/</text>
    <rect x="1026" y="120" width="366" height="255" rx="15" fill="#fffefa" stroke="#b9c4c9" stroke-width="1.5"/>
    <text x="1051" y="158" font-size="24" font-weight="700">다음 세션 · 호출 B</text>
    <text x="1051" y="201" font-size="20">1. status로 목표와 상태 확인</text>
    <text x="1051" y="240" font-size="20">2. 살아 있는 작업·소유권 대조</text>
    <text x="1051" y="279" font-size="20">3. run으로 관측 / 실행 계속</text>
    <text x="1051" y="333" font-size="19" fill="#315d43">완료 셀 A의 결과는 그대로 보존</text>
    <g stroke="#274461" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M414 247H492"/><path d="M937 247H1015"/></g>
    <rect x="48" y="406" width="1344" height="48" rx="10" fill="#fbfaf5"/>
    <text x="720" y="438" text-anchor="middle" font-size="20">새 승인이 필요하면 input-required · 실패 복구는 근거와 변경을 기록 · 같은 작업의 중복 실행 방지</text>
  </g>
</svg>
